name: Site request

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      request:
        description: Change to make (leave blank to check the doc)
        required: false

concurrency:
  group: site-request
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DOC_URL: ${{ vars.DOC_URL }}
    steps:
      - name: Find the next request
        id: find
        env:
          MANUAL: ${{ inputs.request }}
        run: |
          if [ -n "$MANUAL" ]; then
            { echo "id=manual"; echo "request<<EOF"; echo "$MANUAL"; echo "EOF"; echo "go=yes"; } >> "$GITHUB_OUTPUT"; exit 0
          fi
          [ -z "$DOC_URL" ] && { echo "go=no" >> "$GITHUB_OUTPUT"; exit 0; }
          DOC="$(curl -sL "$DOC_URL" | tr -d '\r')"
          LINE="$(echo "$DOC" | grep -m1 -E '^Request:.*\[Queued [a-f0-9]{8}\]' || true)"
          if [ -n "$LINE" ]; then
            ID="$(echo "$LINE" | sed -E 's/.*\[Queued ([a-f0-9]{8})\].*/\1/')"
          else
            LINE="$(echo "$DOC" | grep -v '\[' | grep -m1 -E '^Request:.*\([^)]+\)[[:space:]]*$' || true)"
            ID="$(openssl rand -hex 4)"
          fi
          if [ -z "$LINE" ]; then echo "No new requests."; echo "go=no" >> "$GITHUB_OUTPUT"; exit 0; fi
          REQ="$(echo "$LINE" | sed -E 's/^Request:[[:space:]]*//; s/[[:space:]]*\[Queued [a-f0-9]{8}\].*//')"
          echo "Request $ID: $REQ"
          { echo "id=$ID"; echo "request<<EOF"; echo "$REQ"; echo "EOF"; echo "line<<EOF"; echo "$LINE"; echo "EOF"; echo "go=yes"; } >> "$GITHUB_OUTPUT"

      - name: Tell the doc we're working
        if: steps.find.outputs.go == 'yes' && steps.find.outputs.id != 'manual'
        env:
          ID: ${{ steps.find.outputs.id }}
          LINE: ${{ steps.find.outputs.line }}
        run: |
          jq -n --arg id "$ID" --arg line "$LINE" '{id:$id,status:"working",line:$line}' | curl -sS -L -X POST -H 'Content-Type: application/json' --data @- "$DOC_URL" > /dev/null || true

      - uses: actions/checkout@v4
        if: steps.find.outputs.go == 'yes'
        with:
          fetch-depth: 5

      - name: Claude makes the change
        id: claude
        if: steps.find.outputs.go == 'yes'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            A GSCG team member typed this request in the team doc:

            "${{ steps.find.outputs.request }}"

            Follow CLAUDE.md. Make the change, then write the one-sentence summary to .request-summary.txt.
          claude_args: |
            --max-turns 40
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(git show:*),Bash(git log:*),Bash(git diff:*)"

      - name: Show Claude's message
        if: always() && steps.find.outputs.go == 'yes'
        env:
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          [ -f "$EXEC_FILE" ] && jq -r '.[] | select(.type=="assistant" or .type=="result") | (.message.content[]?.text? // .result? // empty)' "$EXEC_FILE" | head -c 1500 || echo "no execution file"

      - name: Save and publish
        id: save
        if: steps.find.outputs.go == 'yes'
        env:
          ID: ${{ steps.find.outputs.id }}
          REQ: ${{ steps.find.outputs.request }}
        run: |
          git config user.name "gscg-site-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            V="${GITHUB_RUN_NUMBER}"
            sed -i -E "s#(styles\.css|config\.js|app\.js)\?v=[0-9]+#\1?v=${V}#g" index.html
          fi
          git add -A
          if git diff --cached --quiet; then echo "changed=no" >> "$GITHUB_OUTPUT"
          else git commit -m "Site request ${ID}: ${REQ:0:70}"; git push; echo "changed=yes" >> "$GITHUB_OUTPUT"; fi

      - name: Report back to the doc
        if: always() && steps.find.outputs.go == 'yes'
        env:
          ID: ${{ steps.find.outputs.id }}
          OUTCOME: ${{ job.status }}
          CHANGED: ${{ steps.save.outputs.changed }}
        run: |
          SUMMARY="$(head -c 300 .request-summary.txt 2>/dev/null || true)"
          [ -z "$SUMMARY" ] && SUMMARY="No summary was written."
          [ "$CHANGED" = "no" ] && SUMMARY="No files changed. $SUMMARY"
          echo "Outcome: $OUTCOME | $SUMMARY"
          [ "$ID" = "manual" ] && exit 0
          jq -n --arg id "$ID" --arg status "$OUTCOME" --arg summary "$SUMMARY" '{id:$id,status:$status,summary:$summary}' \
            | curl -sS -L -X POST -H 'Content-Type: application/json' --data @- "$DOC_URL" > /dev/null || true
